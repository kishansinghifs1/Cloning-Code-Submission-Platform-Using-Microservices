services:
  evaluator_service:
    build: ./Evaluator-Service
    container_name: evaluator_service
    ports:
      - "14000:4000"
    environment:
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUBMISSION_SERVICE_WEBHOOK_BASE_URL=http://submission_service:5000/api/v1/submissions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - submission_service
      - redis
    networks:
      - leetcode_network

  problem_service:
    build: ./Problem-Service
    container_name: problem_service
    ports:
      - "13000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ATLAS_DB_URL=${ATLAS_DB_URL}
      - LOG_DB_URL=${LOG_DB_URL}
    networks:
      - leetcode_network

  submission_service:
    build: ./Submission-Service
    container_name: submission_service
    ports:
      - "15000:5000"
    environment:
      - PORT=5000
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - ATLAS_DB_URL=${ATLAS_DB_URL}
      - NODE_ENV=production
      - PROBLEM_API_TIMEOUT=5000
      - WEBHOOK_TIMEOUT=5000
      - SUBMISSION_TIMEOUT=3000
      - QUEUE_NAME=SubmissionQueue
      - JOB_NAME=SubmissionJob
      - SUBMISSION_SERVICE_WEBHOOK_URL=http://submission_service:5000/api/v1/submissions
      - EVALUATOR_SERVICE_URL=http://evaluator_service:4000
      - PROBLEM_ADMIN_SERVICE_URL=http://problem_service:3000
      - REDIS_DB=0
    depends_on:
      - redis
      - problem_service
    networks:
      - leetcode_network

  user_service:
    build: ./User-Service
    container_name: user_service
    ports:
      - "16000:6000"
    environment:
      - PORT=6000
      - NODE_ENV=production
      - ATLAS_DB_URL=${ATLAS_DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
    networks:
      - leetcode_network

  redis:
    image: redis:alpine
    container_name: leetcode_redis
    networks:
      - leetcode_network

networks:
  leetcode_network:
    driver: bridge
