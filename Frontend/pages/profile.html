<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CodeJudge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">CodeJudge</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="container profile-container">
        <h1 class="page-title">Profile</h1>

        <!-- Profile View -->
        <div class="card" id="profile-card">
            <div id="profile-loading" class="text-center panel-loading-sm">
                <span class="spinner"></span> Loading...
            </div>
            <div id="profile-view" class="hidden">
                <div class="text-center" style="margin-bottom: 20px;">
                    <img id="p-avatar-img" src="/images/default-avatar.png" alt="Avatar" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color);">
                    <div style="margin-top: 10px;">
                        <button class="btn btn-sm" onclick="showAvatarForm()">Change Avatar</button>
                    </div>
                </div>
                <table class="profile-table">
                    <tr><td class="profile-label">Username</td><td id="p-username"></td></tr>
                    <tr><td class="profile-label">Email</td><td id="p-email"></td></tr>
                    <tr><td class="profile-label">First Name</td><td id="p-firstName"></td></tr>
                    <tr><td class="profile-label">Last Name</td><td id="p-lastName"></td></tr>
                    <tr><td class="profile-label">Role</td><td id="p-role"></td></tr>
                    <tr><td class="profile-label">Joined</td><td id="p-joined"></td></tr>
                </table>
                <div class="action-row mt-10">
                    <button class="btn" onclick="showEditForm()">Edit Profile</button>
                    <button class="btn" onclick="showPasswordForm()">Change Password</button>
                </div>
            </div>
        </div>

        <!-- Edit Profile Form -->
        <div class="card hidden" id="edit-card">
            <h2>Edit Profile</h2>
            <div id="edit-msg" class="msg hidden"></div>
            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-firstName">First Name</label>
                    <input type="text" id="edit-firstName" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="edit-lastName">Last Name</label>
                    <input type="text" id="edit-lastName" maxlength="50">
                </div>
                <div class="action-row">
                    <button type="submit" class="btn btn-primary" id="edit-submit">Save</button>
                    <button type="button" class="btn" onclick="hideEditForm()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Change Avatar Form -->
        <div class="card hidden" id="avatar-card">
            <h2>Change Avatar</h2>
            <div id="avatar-msg" class="msg hidden"></div>
            <form id="avatar-form">
                <div class="form-group">
                    <label for="avatar-input">Select Image (Max 2MB)</label>
                    <input type="file" id="avatar-input" accept="image/jpeg, image/png, image/webp" required>
                </div>
                <div class="action-row">
                    <button type="submit" class="btn btn-primary" id="avatar-submit">Upload</button>
                    <button type="button" class="btn" onclick="hideAvatarForm()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Change Password Form -->
        <div class="card hidden" id="password-card">
            <h2>Change Password</h2>
            <div id="password-msg" class="msg hidden"></div>
            <form id="password-form">
                <div class="form-group">
                    <label for="old-password">Current Password</label>
                    <input type="password" id="old-password" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required minlength="8" placeholder="Min 8 characters">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input type="password" id="confirm-password" required minlength="8">
                </div>
                <div class="action-row">
                    <button type="submit" class="btn btn-primary" id="pw-submit">Change Password</button>
                    <button type="button" class="btn" onclick="hidePasswordForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        if (!Auth.requireAuth()) {
            // Will redirect to login
        }

        // Load profile
        async function loadProfile() {
            try {
                const data = await API.get(CONFIG.USER_SERVICE_URL + '/users/profile');

                if (data.success && data.data) {
                    const u = data.data;
                    document.getElementById('p-username').textContent = u.username || '-';
                    document.getElementById('p-email').textContent = u.email || '-';
                    document.getElementById('p-firstName').textContent = u.firstName || '-';
                    document.getElementById('p-lastName').textContent = u.lastName || '-';
                    document.getElementById('p-role').textContent = u.role || 'user';
                    document.getElementById('p-joined').textContent = u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-';

                    // Pre-fill edit form
                    document.getElementById('edit-firstName').value = u.firstName || '';
                    document.getElementById('edit-lastName').value = u.lastName || '';
                    
                    if (u.avatarUrl) {
                        document.getElementById('p-avatar-img').src = u.avatarUrl;
                    }

                    // Update stored user
                    Auth.setUser(u);

                    document.getElementById('profile-loading').classList.add('hidden');
                    document.getElementById('profile-view').classList.remove('hidden');
                } else {
                    document.getElementById('profile-loading').innerHTML = 'Failed to load profile.';
                }
            } catch (err) {
                document.getElementById('profile-loading').innerHTML = 'Error loading profile.';
            }
        }

        function showEditForm() {
            document.getElementById('edit-card').classList.remove('hidden');
            document.getElementById('password-card').classList.add('hidden');
            document.getElementById('avatar-card').classList.add('hidden');
        }

        function hideEditForm() {
            document.getElementById('edit-card').classList.add('hidden');
        }

        function showPasswordForm() {
            document.getElementById('password-card').classList.remove('hidden');
            document.getElementById('edit-card').classList.add('hidden');
            document.getElementById('avatar-card').classList.add('hidden');
        }

        function hidePasswordForm() {
            document.getElementById('password-card').classList.add('hidden');
        }

        function showAvatarForm() {
            document.getElementById('avatar-card').classList.remove('hidden');
            document.getElementById('edit-card').classList.add('hidden');
            document.getElementById('password-card').classList.add('hidden');
        }

        function hideAvatarForm() {
            document.getElementById('avatar-card').classList.add('hidden');
            document.getElementById('avatar-msg').classList.add('hidden');
            document.getElementById('avatar-form').reset();
        }

        // Upload avatar
        document.getElementById('avatar-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('avatar-msg');
            msg.classList.add('hidden');

            const fileInput = document.getElementById('avatar-input');
            const file = fileInput.files[0];

            if (!file) {
                msg.className = 'msg msg-error';
                msg.textContent = 'Please select a file.';
                msg.classList.remove('hidden');
                return;
            }

            // 2MB validation client-side
            if (file.size > 2 * 1024 * 1024) {
                msg.className = 'msg msg-error';
                msg.textContent = 'File exceeds 2MB limit.';
                msg.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('avatar-submit');
            btn.disabled = true;
            btn.textContent = 'Uploading...';

            const formData = new FormData();
            formData.append('avatar', file);

            try {
                const data = await API.upload(CONFIG.USER_SERVICE_URL + '/users/avatar', formData);

                if (data.success) {
                    msg.className = 'msg msg-success';
                    msg.textContent = 'Avatar updated successfully!';
                    msg.classList.remove('hidden');
                    loadProfile(); 
                    showToast('Avatar updated!', 'success');
                    setTimeout(() => { hideAvatarForm(); }, 1000);
                } else {
                    msg.className = 'msg msg-error';
                    msg.textContent = data.message || 'Upload failed.';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.className = 'msg msg-error';
                msg.textContent = 'Network error or file too large.';
                msg.classList.remove('hidden');
            }

            btn.disabled = false;
            btn.textContent = 'Upload';
        });

        // Edit profile
        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('edit-msg');
            msg.classList.add('hidden');

            const body = {};
            const fn = document.getElementById('edit-firstName').value.trim();
            const ln = document.getElementById('edit-lastName').value.trim();
            if (fn) body.firstName = fn;
            if (ln) body.lastName = ln;

            const btn = document.getElementById('edit-submit');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const data = await API.put(CONFIG.USER_SERVICE_URL + '/users/profile', body);

                if (data.success) {
                    msg.className = 'msg msg-success';
                    msg.textContent = 'Profile updated successfully!';
                    msg.classList.remove('hidden');
                    loadProfile();
                    showToast('Profile updated!', 'success');
                } else {
                    msg.className = 'msg msg-error';
                    msg.textContent = data.message || 'Update failed.';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.className = 'msg msg-error';
                msg.textContent = 'Network error.';
                msg.classList.remove('hidden');
            }

            btn.disabled = false;
            btn.textContent = 'Save';
        });

        // Change password
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('password-msg');
            msg.classList.add('hidden');

            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                msg.className = 'msg msg-error';
                msg.textContent = 'New passwords do not match.';
                msg.classList.remove('hidden');
                return;
            }

            if (newPassword.length < 8) {
                msg.className = 'msg msg-error';
                msg.textContent = 'Password must be at least 8 characters.';
                msg.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('pw-submit');
            btn.disabled = true;
            btn.textContent = 'Changing...';

            try {
                const data = await API.put(CONFIG.USER_SERVICE_URL + '/users/password', {
                    oldPassword,
                    newPassword
                });

                if (data.success) {
                    msg.className = 'msg msg-success';
                    msg.textContent = 'Password changed successfully!';
                    msg.classList.remove('hidden');
                    document.getElementById('password-form').reset();
                    showToast('Password changed!', 'success');
                } else {
                    msg.className = 'msg msg-error';
                    msg.textContent = data.message || 'Password change failed.';
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.className = 'msg msg-error';
                msg.textContent = 'Network error.';
                msg.classList.remove('hidden');
            }

            btn.disabled = false;
            btn.textContent = 'Change Password';
        });

        loadProfile();
    </script>
</body>
</html>
