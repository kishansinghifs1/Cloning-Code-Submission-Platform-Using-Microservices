<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeJudge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">CodeJudge</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>

    <div class="auth-container">
        <div class="card">
            <h2>Login</h2>
            <div id="error-msg" class="msg msg-error hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-btn">
                    Login
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/pages/register.html">Register</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        // Redirect if already logged in
        if (Auth.isLoggedIn()) {
            window.location.href = '/pages/problems.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const data = await API.post(CONFIG.USER_SERVICE_URL + '/users/login', {
                    email,
                    password
                });

                if (data.success) {
                    Auth.setTokens(data.data.accessToken, data.data.refreshToken);
                    Auth.setUser(data.data.user);
                    showToast('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = '/pages/problems.html';
                    }, 500);
                } else {
                    errorMsg.textContent = data.message || 'Invalid credentials.';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = err?.message || 'Network error. Please check if services are running.';
                errorMsg.classList.remove('hidden');
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        });
    </script>
</body>
</html>
