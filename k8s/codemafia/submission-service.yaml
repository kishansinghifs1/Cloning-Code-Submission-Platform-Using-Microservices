apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
    spec:
      containers:
      - name: submission-service
        image: kishansingh1/codemafia:submission
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        envFrom:
        - configMapRef:
            name: platform-config
        - secretRef:
            name: platform-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: default
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: submission-service
