apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: kishansingh1/codemafia:user
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6000
        env:
        - name: PORT
          value: "6000"
        - name: JWT_EXPIRES_IN
          value: "24h"
        - name: JWT_REFRESH_EXPIRES_IN
          value: "7d"
        envFrom:
        - configMapRef:
            name: platform-config
        - secretRef:
            name: platform-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  ports:
  - port: 6000
    targetPort: 6000
  selector:
    app: user-service
